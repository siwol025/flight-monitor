spring:
  application:
    name: flight-monitor
  profiles:
    active: dev

  # DB 계정 및 JPA 기본 설정 (주소 제외)
  datasource:
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 60
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        generate_statistics: false

  # 메일 발송 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 설정 (리다이렉트 URI 제외)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"
            client-secret: "${OAUTH2_GOOGLE_CLIENT_SECRET}"
            scope:
              - email
              - profile

  # Redis(Lettuce) 커넥션 풀 — 블로킹 BRPOP은 전용 커넥션을 요구한다. 풀이 없으면 pop마다 커넥션을
  # 신규 생성/폐기해 고처리량에서 TIME_WAIT 누적으로 에페메랄 포트가 고갈된다(실측: pop ~560/s에서
  # ~50s 만에 포트 고갈 → 파이프라인 스톨). max-active는 동시 블로킹 폴러 수(monitor.worker.count)에
  # push/shedlock/queue-size 등 비블로킹 사용분 헤드룸을 더해 사이징한다.
  data:
    redis:
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 16
          min-idle: 4

# 커스텀 비즈니스 설정
monitor:
  worker:
    count: 3
  consumer:
    # 블로킹 BRPOP 타임아웃(초). redisPopCircuitBreaker.slowCallDurationThreshold(5s) 보다 엄격히 작아야 한다
    # — 그래야 큐가 비었을 때 정상적으로 타임아웃까지 블로킹된 BRPOP 이 "느린 호출"로 오분류되지 않는다.
    # RedisPopCircuitBreakerConsistencyValidator 가 기동 시 fail-fast 로 가드.
    block-pop-timeout-seconds: 3
  backpressure:
    # in-flight 상한의 단일 권위(세마포어 permit 총량). 외부 API 응답 지연이 커져도 동시 처리 수를 이 값으로
    # 상한하고, 초과 백로그는 durable Redis 큐에 남긴다.
    # 값 = 전역 한도 × 응답 시간 p99 ÷ (서버 수 − 1)(서버 1대면 ÷ 1, 스펙 §6-1). Duffel 기본값:
    # 0.45건/초(60초당 27건) × 응답 상한 15초 = 6.75 → 7. p99를 재기 전 초기값은 타임아웃으로 잡는다.
    # 빠른 실험은 환경변수(MONITOR_BACKPRESSURE_MAX_IN_FLIGHT)로만 올리고 monitor.http.max-connections와 함께 올린다.
    max-in-flight: 7
  ratelimiter:
    # 외부 API 전역 호출 한도(기간당 N건) 준수용 Redis 공유 레이트 리미터(Lua 원자 실행). 서버마다 로컬로 걸면 합산이
    # 한도를 넘으므로 토큰과 429 전체 정지를 Redis에 두고 모든 인스턴스·워커가 공유한다.
    # 기본값은 실제 Duffel 한도(60초당 30건)의 90%. 빠른 실험은 MONITOR_RATELIMITER_LIMIT·_PERIOD 환경변수로만 올린다.
    enabled: true
    limit: 27
    period: 60s
  http:
    # Duffel 전용 커넥션 풀 최대 커넥션 수(max-total = max-per-route). max-in-flight와 함께 움직인다: 진행 중인 요청마다
    # 커넥션을 하나씩 붙잡으므로 이 값이 max-in-flight보다 작으면 풀이 새 병목이 된다. 환경변수로 max-in-flight만 올리고
    # 이 값(MONITOR_HTTP_MAX_CONNECTIONS)을 빠뜨리면 DuffelHttpClientConfig가 기동 시 fail-fast로 알린다.
    max-connections: 7
  produce:
    # 모니터링 주기 T=60s (특가 30~90분 소멸 SLA 역산). lock-at-least-for는 주기보다 약간 짧게(주기당 1회 보장),
    # lock-at-most-for는 리더 노드 사망 시 락 자동 만료 안전망(= 주기). 정합 불변식(lock-at-least-for < fixed-rate-ms,
    # lock-at-most-for >= lock-at-least-for)은 ProduceSchedulingConsistencyValidator가 기동 시 fail-fast로 가드.
    fixed-rate-ms: 60000
    lock-at-least-for: PT55S
    lock-at-most-for: PT60S

# 외부 운임 업체(Duffel) 어댑터. mock ↔ 실제 전환은 환경변수 두 개(FARE_PROVIDER_DUFFEL_BASE_URL, DUFFEL_API_TOKEN)로 한다.
fare-provider:
  duffel:
    # 기본값은 실제 업체다. mock 컨트롤러는 프로필과 상관없이 항상 등록되므로 기본값이 mock(자기 자신)이면
    # base-url을 빠뜨렸을 때 가짜 가격으로 실제 사용자에게 알림이 나가고 오류도 나지 않는다. 실제 업체가 기본값이면
    # 토큰 누락이 401(설정 오류)로 드러난다. compose(mock 환경)는 application-docker.yml에서 덮어쓴다.
    base-url: https://api.duffel.com
    # 비어 있으면 호출이 401 → 설정 오류 예외로 드러난다(기동 시 검사 없음)
    api-key: ${DUFFEL_API_TOKEN:}
    version: v2
    # 업체가 항공사 응답을 기다리는 최대 시간(요청 쿼리 supplier_timeout, 허용 2~60초).
    # response-timeout은 이보다 길어야 업체가 정상적으로 마무리한 응답을 우리가 먼저 끊지 않는다.
    supplier-timeout: 10s
    connect-timeout: 3s
    response-timeout: 15s
    # 업체 한도(실측 ratelimit-limit 30, 60초 고정 창). 응답 헤더가 이 값과 다르면 경고 로그를 남긴다.
    # 앱 호출 한도(업체 한도의 90%)와 비교하면 경고가 매번 뜨므로 업체 한도를 따로 둔다.
    expected-rate-limit: 30

subscription:
  expiry:
    cron: "0 0 * * * *"

# MockMailService(dev, docker) 장애 주입 — 메일 유실 재현·측정용. 기본값은 주입 없음
mock:
  mail:
    failure-rate: ${MOCK_MAIL_FAILURE_RATE:0}
    permanent-failure-ratio: ${MOCK_MAIL_PERMANENT_FAILURE_RATIO:0}
    latency-ms: ${MOCK_MAIL_LATENCY_MS:0}
    outage-start-after-ms: ${MOCK_MAIL_OUTAGE_START_AFTER_MS:0}
    outage-duration-ms: ${MOCK_MAIL_OUTAGE_DURATION_MS:0}
  # Duffel 호환 엔드포인트(/air/offer_requests)가 강제하는 업체 한도. 기본값은 실제 Duffel 테스트 모드와 같은
  # 60초당 30건(실측 ratelimit-limit 30, 분 경계 고정 창)이라 어댑터 expected-rate-limit(30)과 맞는다.
  # 여러 대·고한도 실험은 환경변수(MOCK_DUFFEL_RATE_LIMIT_LIMIT 등)로만 올린다.
  duffel:
    rate-limit:
      limit: 30
      period: 60s

kafka:
  topic:
    price-drop-events:
      partitions: 9
    email-send-tasks:
      partitions: 150
  # 메일 발송 블로킹 재시도 (1s → 2s → 4s → 8s → 16s 기본, 총 31초). 30초 이하 SMTP 장애를 DLT 없이 흡수.
  # 재시도 소진 시 email-send-tasks.DLT
  email-task:
    retry:
      max-retries: ${EMAIL_TASK_MAX_RETRIES:5}
      initial-interval-ms: ${EMAIL_TASK_RETRY_INITIAL_INTERVAL_MS:1000}

jwt:
  secret: "${JWT_SECRET}"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

google:
  client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"

# 서킷 브레이커
resilience4j:
  circuitbreaker:
    instances:
      # Producer(Push) 전용
      redisPushCircuitBreaker:
        # 최근 호출 횟수 기준으로 판단
        slidingWindowType: COUNT_BASED
        # 최근 2번의 요청 결과를 저장 (성공/실패 여부 기억)
        slidingWindowSize: 2
        # 최소 1번만 호출돼도 실패율 계산 시작 (호출 수가 적음)
        minimumNumberOfCalls: 1
        # 실패율이 100%면 OPEN (즉, 최근 호출이 실패하면 바로 OPEN)
        failureRateThreshold: 100
        # OPEN 상태가 되면 30초 동안 Redis 접근 차단
        waitDurationInOpenState: 30s
        # HALF_OPEN 상태에서 1건만 테스트 요청 허용
        permittedNumberOfCallsInHalfOpenState: 1

      # Consumer(Pop) 전용
      redisPopCircuitBreaker:
        # Pop은 실시간으로 계속 호출되는 고빈도 작업이기 때문에 시간 기준으로 통계 계산
        slidingWindowType: TIME_BASED
        # 최근 20초간의 요청 상태를 기준으로 판단
        slidingWindowSize: 20
        # 최소 20건 이상 호출되어야 실패율 계산 시작
        minimumNumberOfCalls: 20
        # 실패율이 30% 넘으면 OPEN
        failureRateThreshold: 30
        # 느린 요청 비율이 40% 넘으면 OPEN
        slowCallRateThreshold: 40
        # 느린 요청 판정 임계. block-pop 타임아웃(3s)보다 커야 한다 — 정상적으로 서버 타임아웃까지 블로킹된
        # BRPOP 을 느린 호출로 세지 않도록(서버 타임아웃을 넘어선 실제 클라이언트 측 정체만 서킷을 연다).
        # RedisPopCircuitBreakerConsistencyValidator 가 가드.
        slowCallDurationThreshold: 5s
        # OPEN 상태가 되면 5초 동안 Redis 접근 차단
        waitDurationInOpenState: 5s
        # HALF_OPEN 상태에서 5건만 테스트 요청 허용
        permittedNumberOfCallsInHalfOpenState: 5

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: flight-monitor
    export:
      prometheus:
        enabled: true
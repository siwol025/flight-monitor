spring:
  application:
    name: flight-monitor
  profiles:
    active: dev

  # DB 계정 및 JPA 기본 설정 (주소 제외)
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true

  # 메일 발송 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 설정 (리다이렉트 URI 제외)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"
            client-secret: "${OAUTH2_GOOGLE_CLIENT_SECRET}"
            scope:
              - email
              - profile

# 커스텀 비즈니스 설정
monitor:
  worker:
    count: 3

notification:
  mode: kafka

jwt:
  secret: "${JWT_SECRET}"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

google:
  client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"

# 서킷 브레이커
resilience4j.circuitbreaker:
  configs:
    default: # Write 및 일반적인 용도의 기본 설정 (기존 유지)
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 30s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

    read-heavy: # 지속적인 Polling(Read)이 발생하는 곳을 위한 설정 추가
      registerHealthIndicator: true
      slidingWindowSize: 60                  # 최근 60번의 호출(약 1분 치)을 기준으로 평가
      minimumNumberOfCalls: 30               # 최소 30번은 호출되어야 실패율 계산 시작
      permittedNumberOfCallsInHalfOpenState: 5
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 20s           # Read는 빨리 회복하는지 자주 확인하도록 대기 시간 단축
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

  instances:
    redisCache:
      baseConfig: default
    redisQueueWrite: # Write 전용 인스턴스
      baseConfig: default
    redisQueueRead:  # Read 전용 인스턴스 (새로 추가한 read-heavy 설정 사용)
      baseConfig: read-heavy

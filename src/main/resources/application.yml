spring:
  application:
    name: flight-monitor
  profiles:
    active: dev

  # DB 계정 및 JPA 기본 설정 (주소 제외)
  datasource:
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 60
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        generate_statistics: false

  # 메일 발송 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 설정 (리다이렉트 URI 제외)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"
            client-secret: "${OAUTH2_GOOGLE_CLIENT_SECRET}"
            scope:
              - email
              - profile

  # Redis(Lettuce) 커넥션 풀 — 블로킹 BRPOP은 전용 커넥션을 요구한다. 풀이 없으면 pop마다 커넥션을
  # 신규 생성/폐기해 고처리량에서 TIME_WAIT 누적으로 에페메랄 포트가 고갈된다(실측: pop ~560/s에서
  # ~50s 만에 포트 고갈 → 파이프라인 스톨). max-active는 동시 블로킹 폴러 수(monitor.worker.count)에
  # push/shedlock/queue-size 등 비블로킹 사용분 헤드룸을 더해 사이징한다.
  data:
    redis:
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 16
          min-idle: 4

# 커스텀 비즈니스 설정
monitor:
  worker:
    count: 3
  consumer:
    # 블로킹 BRPOP 타임아웃(초). redisPopCircuitBreaker.slowCallDurationThreshold(5s) 보다 엄격히 작아야 한다
    # — 그래야 큐가 비었을 때 정상적으로 타임아웃까지 블로킹된 BRPOP 이 "느린 호출"로 오분류되지 않는다.
    # RedisPopCircuitBreakerConsistencyValidator 가 기동 시 fail-fast 로 가드.
    block-pop-timeout-seconds: 3
  backpressure:
    # in-flight 상한의 단일 권위. monitoringTaskExecutor는 가상 스레드 per-task executor(풀 max/큐/거부 없음)이므로
    # 동시 처리 수는 오직 이 세마포어 permit 총량이 결정한다.
    #
    # 780 = 잠정(PROVISIONAL)·측정-게이팅 값. Little's Law 역산(목표 600 TPS × 외부 API 1.3s)으로 산출했으며,
    # 느린-API before/after 재측정으로 확정한다. 이는 하위 리소스 풀(HTTP 커넥션 풀, HikariCP)이
    # 지탱하도록 사이징해야 할 목표 동시성이기도 하다. 세마포어가 in-flight 상한의 단일 권위다.
    # 참고: monitor.worker.count=3 폴러로 이 780 permit을 채울 수 있는지는 부하 하에서 검증 필요(측정-게이팅).
    max-in-flight: 780
  http:
    # 외부 API 커넥션 풀 최대 커넥션 수(max-total = max-per-route). 상향된 in-flight 세마포어 permit을
    # 실제로 받쳐주려면 max-in-flight 이상이어야 하며, 미만이면 풀이 새 병목이 된다.
    # 정합 불변식(max-connections >= max-in-flight)은 RestTemplateConfig가 기동 시 fail-fast로 가드.
    # 값은 max-in-flight와 함께 느린-API 재측정에서 확정(측정-게이팅).
    max-connections: 780
  produce:
    # 모니터링 주기 T=60s (특가 30~90분 소멸 SLA 역산). lock-at-least-for는 주기보다 약간 짧게(주기당 1회 보장),
    # lock-at-most-for는 리더 노드 사망 시 락 자동 만료 안전망(= 주기). 정합 불변식(lock-at-least-for < fixed-rate-ms,
    # lock-at-most-for >= lock-at-least-for)은 ProduceSchedulingConsistencyValidator가 기동 시 fail-fast로 가드.
    fixed-rate-ms: 60000
    lock-at-least-for: PT55S
    lock-at-most-for: PT60S

subscription:
  expiry:
    cron: "0 0 * * * *"

notification:
  mode: kafka
  cooldown:
    hours: 24

kafka:
  topic:
    price-drop-events:
      partitions: 9
    email-send-tasks:
      partitions: 150

jwt:
  secret: "${JWT_SECRET}"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

google:
  client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"

# 서킷 브레이커
resilience4j:
  circuitbreaker:
    instances:
      # Producer(Push) 전용
      redisPushCircuitBreaker:
        # 최근 호출 횟수 기준으로 판단
        slidingWindowType: COUNT_BASED
        # 최근 2번의 요청 결과를 저장 (성공/실패 여부 기억)
        slidingWindowSize: 2
        # 최소 1번만 호출돼도 실패율 계산 시작 (호출 수가 적음)
        minimumNumberOfCalls: 1
        # 실패율이 100%면 OPEN (즉, 최근 호출이 실패하면 바로 OPEN)
        failureRateThreshold: 100
        # OPEN 상태가 되면 30초 동안 Redis 접근 차단
        waitDurationInOpenState: 30s
        # HALF_OPEN 상태에서 1건만 테스트 요청 허용
        permittedNumberOfCallsInHalfOpenState: 1

      # Consumer(Pop) 전용
      redisPopCircuitBreaker:
        # Pop은 실시간으로 계속 호출되는 고빈도 작업이기 때문에 시간 기준으로 통계 계산
        slidingWindowType: TIME_BASED
        # 최근 20초간의 요청 상태를 기준으로 판단
        slidingWindowSize: 20
        # 최소 20건 이상 호출되어야 실패율 계산 시작
        minimumNumberOfCalls: 20
        # 실패율이 30% 넘으면 OPEN
        failureRateThreshold: 30
        # 느린 요청 비율이 40% 넘으면 OPEN
        slowCallRateThreshold: 40
        # 느린 요청 판정 임계. block-pop 타임아웃(3s)보다 커야 한다 — 정상적으로 서버 타임아웃까지 블로킹된
        # BRPOP 을 느린 호출로 세지 않도록(서버 타임아웃을 넘어선 실제 클라이언트 측 정체만 서킷을 연다).
        # RedisPopCircuitBreakerConsistencyValidator 가 가드.
        slowCallDurationThreshold: 5s
        # OPEN 상태가 되면 5초 동안 Redis 접근 차단
        waitDurationInOpenState: 5s
        # HALF_OPEN 상태에서 5건만 테스트 요청 허용
        permittedNumberOfCallsInHalfOpenState: 5

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: flight-monitor
    export:
      prometheus:
        enabled: true
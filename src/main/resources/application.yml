spring:
  application:
    name: flight-monitor
  profiles:
    active: dev

  # DB 계정 및 JPA 기본 설정 (주소 제외)
  datasource:
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 60
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        generate_statistics: false

  # 메일 발송 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 설정 (리다이렉트 URI 제외)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"
            client-secret: "${OAUTH2_GOOGLE_CLIENT_SECRET}"
            scope:
              - email
              - profile

# 커스텀 비즈니스 설정
monitor:
  worker:
    count: 3
  backpressure:
    # in-flight 세마포어 permit 총량이자 monitoringTaskExecutor의 max-pool-size 소스(단일 진실 공급원).
    # 세마포어와 풀 max가 이 한 값으로 정렬됨 — MonitoringExecutorAlignmentTest가 가드.
    max-in-flight: 100
  executor:
    # monitoringTaskExecutor 코어 스레드 수. 정확한 크기는 부하 측정 단계에서 확정(measurement-gated).
    core-pool-size: 30
    # 큐 용량: worker.count(현재 3) 이상이어야 processTask.finally의 permit 반납이 풀 스레드가 idle로 복귀하기
    # 직전에 일어나는 레이스를 흡수한다. 동시에 부하 시 풀이 max 쪽으로 성장하도록 충분히 작게 유지한다.
    # 정확한 크기는 부하 측정 단계에서 확정(measurement-gated).
    queue-capacity: 8
  produce:
    # 모니터링 주기 T=60s (특가 30~90분 소멸 SLA 역산). lock-at-least-for는 주기보다 약간 짧게(주기당 1회 보장),
    # lock-at-most-for는 리더 노드 사망 시 락 자동 만료 안전망(= 주기). 정합 불변식(lock-at-least-for < fixed-rate-ms,
    # lock-at-most-for >= lock-at-least-for)은 ProduceSchedulingConsistencyValidator가 기동 시 fail-fast로 가드.
    fixed-rate-ms: 60000
    lock-at-least-for: PT55S
    lock-at-most-for: PT60S

subscription:
  expiry:
    cron: "0 0 * * * *"

notification:
  mode: kafka
  cooldown:
    hours: 24

kafka:
  topic:
    price-drop-events:
      partitions: 9
    email-send-tasks:
      partitions: 150

jwt:
  secret: "${JWT_SECRET}"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

google:
  client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"

# 서킷 브레이커
resilience4j:
  circuitbreaker:
    instances:
      # Producer(Push) 전용
      redisPushCircuitBreaker:
        # 최근 호출 횟수 기준으로 판단
        slidingWindowType: COUNT_BASED
        # 최근 2번의 요청 결과를 저장 (성공/실패 여부 기억)
        slidingWindowSize: 2
        # 최소 1번만 호출돼도 실패율 계산 시작 (호출 수가 적음)
        minimumNumberOfCalls: 1
        # 실패율이 100%면 OPEN (즉, 최근 호출이 실패하면 바로 OPEN)
        failureRateThreshold: 100
        # OPEN 상태가 되면 30초 동안 Redis 접근 차단
        waitDurationInOpenState: 30s
        # HALF_OPEN 상태에서 1건만 테스트 요청 허용
        permittedNumberOfCallsInHalfOpenState: 1

      # Consumer(Pop) 전용
      redisPopCircuitBreaker:
        # Pop은 실시간으로 계속 호출되는 고빈도 작업이기 때문에 시간 기준으로 통계 계산
        slidingWindowType: TIME_BASED
        # 최근 20초간의 요청 상태를 기준으로 판단
        slidingWindowSize: 20
        # 최소 20건 이상 호출되어야 실패율 계산 시작
        minimumNumberOfCalls: 20
        # 실패율이 30% 넘으면 OPEN
        failureRateThreshold: 30
        # 느린 요청 비율이 40% 넘으면 OPEN
        slowCallRateThreshold: 40
        # 3초 이상 걸리면 느린 요청으로 판단
        slowCallDurationThreshold: 3s
        # OPEN 상태가 되면 5초 동안 Redis 접근 차단
        waitDurationInOpenState: 5s
        # HALF_OPEN 상태에서 5건만 테스트 요청 허용
        permittedNumberOfCallsInHalfOpenState: 5

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: flight-monitor
    export:
      prometheus:
        enabled: true
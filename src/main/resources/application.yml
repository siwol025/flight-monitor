spring:
  application:
    name: flight-monitor
  profiles:
    active: dev

  # DB 계정 및 JPA 기본 설정 (주소 제외)
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true

  # 메일 발송 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 설정 (리다이렉트 URI 제외)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"
            client-secret: "${OAUTH2_GOOGLE_CLIENT_SECRET}"
            scope:
              - email
              - profile

# 커스텀 비즈니스 설정
monitor:
  worker:
    count: 3

notification:
  mode: kafka

jwt:
  secret: "${JWT_SECRET}"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

google:
  client-id: "${OAUTH2_GOOGLE_CLIENT_ID}"

# 서킷 브레이커
resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowSize: 10                  # 최근 10번의 호출을 기준으로 실패율 계산
      minimumNumberOfCalls: 5                # 실패율을 계산하기 위한 최소 호출 횟수
      permittedNumberOfCallsInHalfOpenState: 3 # Half-Open 상태에서 허용할 테스트 호출 횟수
      automaticTransitionFromOpenToHalfOpenEnabled: true # 지정된 시간 후 자동으로 Half-Open 전환
      waitDurationInOpenState: 30s           # Circuit Open 상태 유지 시간 (30초 후 Half-Open 전환)
      failureRateThreshold: 50               # 실패율이 50% 이상일 때 Circuit Open
      eventConsumerBufferSize: 10
  instances:
    redisCache:
      baseConfig: default
    redisQueue:
      baseConfig: default

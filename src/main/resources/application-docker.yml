spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/flight_monitor?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:29092

  security:
    oauth2:
      client:
        registration:
          google:
            # Nginx(80포트)를 통해 통신하므로 포트번호 제거
            redirect-uri: "http://localhost/login/oauth2/code/google"

logging:
  level:
    org.apache.kafka: INFO
    org.springframework.kafka: INFO

external:
  api:
    # 각 애플리케이션 컨테이너가 직접 통신하지 않고 Nginx를 거치도록 설정
    # url: "http://nginx/external/api/flights/"
    url: ${EXTERNAL_API_URL:http://localhost:8080/external/api/flights/}
# docker-compose.yml
version: '3.8'

x-app-template: &app_template
  image: flight-monitor-app
  env_file:
    - .env
  depends_on:
    # 스키마는 앱이 기동할 때 Flyway가 적용한다. 앱과 mock이 동시에 돌려도 Flyway의 MySQL 잠금으로 한쪽만 적용한다
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
    kafka:
      condition: service_healthy
  networks:
    - flight-network

services:
  mysql:
    # LTS(8.4) 고정. 9.x Innovation 릴리스는 다음 버전이 나오면 지원이 끝나고, 운영 관리형 DB도 8.x 계열이다
    image: mysql:8.4.10
    container_name: flight-mysql
    # .env 전체(env_file)가 아니라 DB 자격 증명 두 개만 넘긴다(다른 비밀값이 docker inspect로 보이지 않게).
    # 값은 compose가 프로젝트의 .env로 보간하고, 비어 있으면 빈 root 비밀번호 대신 오류로 멈춘다
    environment:
      MYSQL_DATABASE: flight_monitor
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    # MySQL 이미지는 MYSQL_USER=root를 거부한다(일반 사용자 전용). .env의 DB_USERNAME이 root여도 일반 사용자여도 같은
    # 자격 증명으로 접속되게, root 비밀번호는 항상 DB_PASSWORD로 두고 root가 아닐 때만 일반 사용자를 만든다.
    # $$는 compose 보간을 피해 컨테이너 셸이 펼친다
    entrypoint:
      - sh
      - -c
      - >-
        export MYSQL_ROOT_PASSWORD="$$DB_PASSWORD";
        if [ "$$DB_USERNAME" != root ]; then export MYSQL_USER="$$DB_USERNAME" MYSQL_PASSWORD="$$DB_PASSWORD"; fi;
        exec docker-entrypoint.sh mysqld
    # 호스트 3306은 기존 호스트 MySQL이 쓴다. 루프백에만 연다(dev bootRun·직접 조회용). 앱 컨테이너는 mysql:3306으로 붙는다
    ports:
      - "127.0.0.1:3307:3306"
    # 자격 증명 없이 확인한다. 초기화용 임시 서버는 TCP를 열지 않으므로 실제 서버가 뜬 뒤에만 통과한다
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - flight-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml # 분리된 파일을 마운트
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - flight-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - flight-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards

  redis:
    image: redis:7.0-alpine
    container_name: flight-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - flight-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: flight-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_METADATA_MAX_IDLE_INTERVAL_MS: 3600000
      KAFKA_LOG4J_LOGGERS: "org.apache.kafka.image.loader.MetadataLoader=WARN"
      CLUSTER_ID: 'MkU3OEVBNTcwNTJDRDRFMg'
    networks:
      - flight-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: [ "--kafka.server=kafka:29092" ]
    ports:
      - "9308:9308"
    networks:
      - flight-network
    # [추가할 부분] 카프카가 헬스체크를 통과한 이후에만 실행되도록 순서 보장
    depends_on:
      kafka:
        condition: service_healthy

  flight-app:
    <<: *app_template
    container_name: flight-main-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xms3072m -Xmx3072m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  flight-mock-api:
    <<: *app_template
    container_name: flight-mock-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker, mock
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx512m -XX:+UseG1GC
      # 기동 시 시딩(약 4만 행)의 JDBC 배치를 다중 행 INSERT 하나로 묶는다. 없으면 MySQL 드라이버가 행마다 왕복한다
      - SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_REWRITEBATCHEDSTATEMENTS=true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

networks:
  flight-network:
    driver: bridge

volumes:
  grafana-data:
  mysql-data:
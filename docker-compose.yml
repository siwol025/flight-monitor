# docker-compose.yml
version: '3.8'

x-app-template: &app_template
  image: flight-monitor-app
  env_file:
    - .env
  depends_on:
    redis:
      condition: service_started
    kafka:
      condition: service_healthy
  networks:
    - flight-network

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml # 분리된 파일을 마운트
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - flight-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - flight-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards

  redis:
    image: redis:7.0-alpine
    container_name: flight-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - flight-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: flight-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_METADATA_MAX_IDLE_INTERVAL_MS: 3600000
      KAFKA_LOG4J_LOGGERS: "org.apache.kafka.image.loader.MetadataLoader=WARN"
      CLUSTER_ID: 'MkU3OEVBNTcwNTJDRDRFMg'
    networks:
      - flight-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: [ "--kafka.server=kafka:29092" ]
    ports:
      - "9308:9308"
    networks:
      - flight-network
    # [추가할 부분] 카프카가 헬스체크를 통과한 이후에만 실행되도록 순서 보장
    depends_on:
      kafka:
        condition: service_healthy

  flight-app:
    <<: *app_template
    container_name: flight-main-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xms3072m -Xmx3072m -XX:+UseG1GC
      - EXTERNAL_API_URL=http://flight-mock-api:8080/external/api/flights/
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  flight-mock-api:
    <<: *app_template
    container_name: flight-mock-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker, mock
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx512m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

networks:
  flight-network:
    driver: bridge

volumes:
  grafana-data:
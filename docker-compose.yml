# docker-compose.yml
version: '3.8'

x-app-template: &app_template
  image: flight-monitor-app
  env_file:
    - .env
  depends_on:
    # 스키마는 앱이 기동할 때 Flyway가 적용한다. 앱과 mock이 동시에 돌려도 Flyway의 MySQL 잠금으로 한쪽만 적용한다
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
    rabbitmq:
      condition: service_healthy
  networks:
    - flight-network

services:
  mysql:
    # LTS(8.4) 고정. 9.x Innovation 릴리스는 다음 버전이 나오면 지원이 끝나고, 운영 관리형 DB도 8.x 계열이다
    image: mysql:8.4.10
    container_name: flight-mysql
    # .env 전체(env_file)가 아니라 DB 자격 증명 두 개만 넘긴다(다른 비밀값이 docker inspect로 보이지 않게).
    # 값은 compose가 프로젝트의 .env로 보간하고, 비어 있으면 빈 root 비밀번호 대신 오류로 멈춘다
    environment:
      MYSQL_DATABASE: flight_monitor
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    # MySQL 이미지는 MYSQL_USER=root를 거부한다(일반 사용자 전용). .env의 DB_USERNAME이 root여도 일반 사용자여도 같은
    # 자격 증명으로 접속되게, root 비밀번호는 항상 DB_PASSWORD로 두고 root가 아닐 때만 일반 사용자를 만든다.
    # $$는 compose 보간을 피해 컨테이너 셸이 펼친다
    entrypoint:
      - sh
      - -c
      - >-
        export MYSQL_ROOT_PASSWORD="$$DB_PASSWORD";
        if [ "$$DB_USERNAME" != root ]; then export MYSQL_USER="$$DB_USERNAME" MYSQL_PASSWORD="$$DB_PASSWORD"; fi;
        exec docker-entrypoint.sh mysqld
    # 호스트 3306은 기존 호스트 MySQL이 쓴다. 루프백에만 연다(dev bootRun·직접 조회용). 앱 컨테이너는 mysql:3306으로 붙는다
    ports:
      - "127.0.0.1:3307:3306"
    # 자격 증명 없이 확인한다. 초기화용 임시 서버는 TCP를 열지 않으므로 실제 서버가 뜬 뒤에만 통과한다
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - flight-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml # 분리된 파일을 마운트
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - flight-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - flight-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards

  redis:
    image: redis:7.0-alpine
    container_name: flight-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - flight-network

  rabbitmq:
    # management 이미지는 관리 화면(rabbitmq_management)과 지표(rabbitmq_prometheus, 15692)를 기본으로 켠다
    image: rabbitmq:4.3.7-management
    container_name: flight-rabbitmq
    # 데이터 디렉터리가 노드 이름(rabbit@호스트명) 아래에 생기므로 호스트명을 고정한다. 없으면 컨테이너를 다시 만들 때
    # 호스트명이 바뀌어 볼륨의 durable 큐를 찾지 못한다
    hostname: rabbitmq
    # 자격 증명은 compose가 프로젝트의 .env로 보간하고, 비어 있으면 오류로 멈춘다(기본 guest는 원격 접속이 막혀 있다)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME을 .env에 설정하세요}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD를 .env에 설정하세요}
    # 루프백에만 연다(dev bootRun·관리 화면용). 앱 컨테이너는 rabbitmq:5672, Prometheus는 rabbitmq:15692로 붙는다
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - flight-network

  flight-app:
    <<: *app_template
    container_name: flight-main-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_TOOL_OPTIONS=-Xms3072m -Xmx3072m -XX:+UseG1GC
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  flight-mock-api:
    <<: *app_template
    container_name: flight-mock-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker, mock
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx512m -XX:+UseG1GC
      # 기동 시 시딩(약 4만 행)의 JDBC 배치를 다중 행 INSERT 하나로 묶는다. 없으면 MySQL 드라이버가 행마다 왕복한다.
      # 드라이버 속성 이름은 대소문자를 구분하는데 환경 변수로는 Hikari data-source-properties의 Map 키를 대소문자 그대로
      # 넘길 수 없어서 URL 파라미터로 준다. 나머지는 application-docker.yml의 url과 같게 유지한다
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/flight_monitor?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

networks:
  flight-network:
    driver: bridge

volumes:
  grafana-data:
  mysql-data:
  rabbitmq-data:
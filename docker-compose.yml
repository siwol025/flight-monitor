version: '3.8'

services:
  # ==========================================
  # 1. 인프라 영역 (Infrastructure)
  # ==========================================
#  mysql:
#    image: mysql:8.0.40
#    container_name: flight-mysql
#    ports:
#      - "3306:3306"
#    environment:
#      MYSQL_DATABASE: flight_monitor
#      MYSQL_USER: fmAdmin
#      MYSQL_PASSWORD: coajfkq4920571
#      MYSQL_ROOT_PASSWORD: coajfkq4920571
#    networks:
#      - flight-network

  redis:
    image: redis:7.0-alpine
    container_name: flight-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - flight-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: flight-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJDRDRFMg'
    networks:
      - flight-network

  # ==========================================
  # 2. 애플리케이션 영역 (Application - 4 Nodes)
  # ==========================================
  # YAML Anchor(&app_template)를 사용하여 중복 설정을 최소화합니다.
  app1: &app_template
    image: flight-monitor-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    env_file:
      - .env
    depends_on:
#      - mysql
      - redis
      - kafka
    networks:
      - flight-network

  app2:
    <<: *app_template

  app3:
    <<: *app_template

  mock-app:
    <<: *app_template
    container_name: flight-mock-app

  # ==========================================
  # 3. 로드 밸런서 영역 (Load Balancer)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: flight-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - mock-app
    networks:
      - flight-network

# 컨테이너 간 이름(DNS) 기반 통신을 위한 가상 네트워크망
networks:
  flight-network:
    driver: bridge
events {
    worker_connections 1024;
}

http {
    # 일반 사용자 트래픽을 처리할 3대의 애플리케이션
    upstream flight_monitor_apps {
        server app1:8080;
        server app2:8080;
        server app3:8080;
    }

    # 외부 항공사 Mock API 역할을 전담할 1대의 애플리케이션
    upstream mock_api_server {
        server mock-app:8080;
    }

    server {
        listen 80;

        # 1. Mock API 트래픽 라우팅
        # 애플리케이션들이 http://nginx/external/api/... 로 요청하면 이 블록이 가로채서 mock-app으로 보냅니다.
        location /external/api/ {
            proxy_pass http://mock_api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. 일반 사용자 트래픽 라우팅 (위의 경로를 제외한 나머지 모든 요청)
        location / {
            proxy_pass http://flight_monitor_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
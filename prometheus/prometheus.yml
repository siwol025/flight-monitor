global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'flight-monitor-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['flight-main-app:8080']

  - job_name: 'kafka-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['kafka-exporter:9308']